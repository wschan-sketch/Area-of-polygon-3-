<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小五數學：多邊形面積過三關</title>
    <!-- 引入 Tailwind CSS 進行排版與設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- 引入 Babel 讓瀏覽器可以直接編譯 JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        /* 避免數字輸入框出現上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* 自定義淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // --- 替換原本的 Lucide Icons 為內建 SVG 組件，確保單檔完美執行 ---
        const IconTrophy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );
        const IconPlay = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>
        );
        const IconLightbulb = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        );
        const IconHelpCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        );
        const IconCheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );
        const IconXCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        );
        const IconArrowRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        );
        const IconDelete = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        );

        // 音效播放函數 (使用 Web Audio API)
        const playSound = (type) => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (type === 'correct') {
                    // 答對音效：輕快向上的琶音
                    const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                        
                        gain.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
                        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + i * 0.1 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                        
                        osc.start(audioCtx.currentTime + i * 0.1);
                        osc.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                    });
                } else if (type === 'incorrect') {
                    // 答錯音效：低沉的提示音
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    
                    gain.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {
                console.log("Browser doesn't support audio or interaction required first.");
            }
        };

        // --- 背景音樂管理器 ---
        let bgmCtx = null;
        let bgmInterval = null;

        const startBGM = () => {
            if (bgmInterval) return; // 避免重複播放
            try {
                bgmCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (bgmCtx.state === 'suspended') bgmCtx.resume();
                
                // 輕快柔和的和弦琶音
                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63]; 
                let step = 0;
                
                bgmInterval = setInterval(() => {
                    if (bgmCtx.state !== 'running') return;
                    const osc = bgmCtx.createOscillator();
                    const gain = bgmCtx.createGain();
                    osc.connect(gain);
                    gain.connect(bgmCtx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.value = notes[step % notes.length];
                    
                    // 背景音量調得非常小，不干擾主音效
                    gain.gain.setValueAtTime(0, bgmCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.015, bgmCtx.currentTime + 0.1); 
                    gain.gain.exponentialRampToValueAtTime(0.001, bgmCtx.currentTime + 0.6);
                    
                    osc.start(bgmCtx.currentTime);
                    osc.stop(bgmCtx.currentTime + 0.6);
                    
                    step++;
                }, 600); // 節奏速度
            } catch (e) {
                console.log("BGM not supported or blocked");
            }
        };

        const stopBGM = () => {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
            if (bgmCtx) {
                bgmCtx.close();
                bgmCtx = null;
            }
        };

        // --- 第一關 SVG (藍色圖形 - 正方形 + 平行四邊形) ---
        const Level1SVG = ({ showHint }) => (
            <svg viewBox="-30 0 380 260" className="w-full h-full drop-shadow-md">
                <defs>
                    <marker id="arrow-start" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
                        <path d="M 6 0 L 0 3 L 6 6 Z" fill="#4b5563" />
                    </marker>
                    <marker id="arrow-end" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                        <path d="M 0 0 L 6 3 L 0 6 Z" fill="#4b5563" />
                    </marker>
                </defs>
                <path d="M 50 110 L 140 110 L 260 20 L 260 110 L 140 200 L 50 200 Z" fill="#7dd3fc" stroke="#0284c7" strokeWidth="3" strokeLinejoin="round" />
                {showHint && <line x1="140" y1="110" x2="140" y2="200" stroke="red" strokeWidth="4" strokeDasharray="6,6" className="animate-pulse" />}
                <path d="M 140 200 L 260 200 L 260 110" fill="none" stroke="#4b5563" strokeWidth="2" strokeDasharray="5,5" />
                <path d="M 50 125 L 65 125 L 65 110" fill="none" stroke="#0284c7" strokeWidth="2" />
                <path d="M 50 185 L 65 185 L 65 200" fill="none" stroke="#0284c7" strokeWidth="2" />
                <path d="M 245 200 L 245 185 L 260 185" fill="none" stroke="#4b5563" strokeWidth="2" />
                
                {/* 左方與上方數字 (無箭頭) */}
                <text x="35" y="160" textAnchor="end" fill="#0f172a" className="font-bold text-lg md:text-xl">3 cm</text>
                <text x="95" y="95" textAnchor="middle" fill="#0f172a" className="font-bold text-lg md:text-xl">3 cm</text>
                
                {/* 下方標示 (有箭頭) */}
                <line x1="50" y1="215" x2="140" y2="215" stroke="#4b5563" strokeWidth="1.5" markerStart="url(#arrow-start)" markerEnd="url(#arrow-end)" />
                <text x="95" y="240" textAnchor="middle" fill="#0f172a" className="font-bold text-lg md:text-xl">3 cm</text>
                
                <line x1="140" y1="215" x2="260" y2="215" stroke="#4b5563" strokeWidth="1.5" markerStart="url(#arrow-start)" markerEnd="url(#arrow-end)" />
                <text x="200" y="240" textAnchor="middle" fill="#0f172a" className="font-bold text-lg md:text-xl">5 cm</text>
                
                {/* 右方標示 (有箭頭) */}
                <line x1="275" y1="20" x2="275" y2="110" stroke="#4b5563" strokeWidth="1.5" markerStart="url(#arrow-start)" markerEnd="url(#arrow-end)" />
                <text x="285" y="70" textAnchor="start" fill="#0f172a" className="font-bold text-lg md:text-xl">3 cm</text>
                
                <line x1="275" y1="110" x2="275" y2="200" stroke="#4b5563" strokeWidth="1.5" markerStart="url(#arrow-start)" markerEnd="url(#arrow-end)" />
                <text x="285" y="160" textAnchor="start" fill="#0f172a" className="font-bold text-lg md:text-xl">3 cm</text>
            </svg>
        );

        // --- 第二關 SVG (紫色圖形 - 直角三角形 + 長方形) ---
        const Level2SVG = ({ showHint }) => (
            <svg viewBox="0 0 350 320" className="w-full h-full drop-shadow-md">
                <path d="M 100 270 L 250 270 L 250 150 L 196 78 L 100 150 Z" fill="#d8b4fe" stroke="#7e22ce" strokeWidth="3" strokeLinejoin="round" />
                {showHint && <line x1="100" y1="150" x2="250" y2="150" stroke="red" strokeWidth="4" strokeDasharray="6,6" className="animate-pulse" />}
                <path d="M 100 255 L 115 255 L 115 270" fill="none" stroke="#7e22ce" strokeWidth="2" />
                <path d="M 250 255 L 235 255 L 235 270" fill="none" stroke="#7e22ce" strokeWidth="2" />
                <path d="M 184 87 L 193 99 L 205 90" fill="none" stroke="#7e22ce" strokeWidth="2" />
                <text x="85" y="215" textAnchor="end" fill="#581c87" className="font-bold text-lg md:text-xl">5 cm</text>
                <text x="175" y="295" textAnchor="middle" fill="#581c87" className="font-bold text-lg md:text-xl">6 cm</text>
                <text x="265" y="215" textAnchor="start" fill="#581c87" className="font-bold text-lg md:text-xl">5 cm</text>
                <text x="130" y="105" textAnchor="end" fill="#581c87" className="font-bold text-lg md:text-xl">5 cm</text>
                <text x="235" y="105" textAnchor="start" fill="#581c87" className="font-bold text-lg md:text-xl">2 cm</text>
            </svg>
        );

        // --- 第三關 SVG (綠色圖形 - 兩個梯形) ---
        const Level3SVG = ({ showHint }) => (
            <svg viewBox="0 0 400 250" className="w-full h-full drop-shadow-md">
                <defs>
                    <marker id="arrow-left" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
                        <path d="M 8 0 L 0 4 L 8 8 Z" fill="#065f46" />
                    </marker>
                    <marker id="arrow-right" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                        <path d="M 0 0 L 8 4 L 0 8 Z" fill="#065f46" />
                    </marker>
                </defs>
                <path d="M 152 102 L 248 102 L 328 150 L 248 198 L 152 198 L 72 150 Z" fill="#a7f3d0" stroke="#047857" strokeWidth="3" strokeLinejoin="round" />
                
                {/* 補回中間的常駐虛線 */}
                <line x1="72" y1="150" x2="328" y2="150" stroke="#047857" strokeWidth="2" strokeDasharray="5,5" />
                
                {/* 提示狀態的紅色虛線疊加 */}
                {showHint && <line x1="72" y1="150" x2="328" y2="150" stroke="red" strokeWidth="4" strokeDasharray="6,6" className="animate-pulse" />}
                
                <path d="M 72 150 L 72 198 L 152 198" fill="none" stroke="#4b5563" strokeWidth="2" strokeDasharray="5,5" />
                <path d="M 72 183 L 87 183 L 87 198" fill="none" stroke="#4b5563" strokeWidth="2" />
                <text x="60" y="180" textAnchor="end" fill="#4b5563" className="font-bold text-lg md:text-xl">2 m</text>
                <path d="M 328 150 L 328 102 L 248 102" fill="none" stroke="#4b5563" strokeWidth="2" strokeDasharray="5,5" />
                <path d="M 328 117 L 313 117 L 313 102" fill="none" stroke="#4b5563" strokeWidth="2" />
                <text x="340" y="130" textAnchor="start" fill="#4b5563" className="font-bold text-lg md:text-xl">2 m</text>
                <line x1="152" y1="85" x2="248" y2="85" stroke="#065f46" strokeWidth="1.5" markerStart="url(#arrow-left)" markerEnd="url(#arrow-right)" />
                <text x="200" y="75" textAnchor="middle" fill="#065f46" className="font-bold text-lg md:text-xl">4 m</text>
                <line x1="152" y1="215" x2="248" y2="215" stroke="#065f46" strokeWidth="1.5" markerStart="url(#arrow-left)" markerEnd="url(#arrow-right)" />
                <text x="200" y="235" textAnchor="middle" fill="#065f46" className="font-bold text-lg md:text-xl">4 m</text>
                <text x="200" y="142" textAnchor="middle" fill={showHint ? "red" : "#047857"} className="font-bold text-lg md:text-xl transition-colors">16 m</text>
            </svg>
        );

        // --- 關卡資料定義 ---
        const levels = [
            {
                id: 1,
                unit: 'cm',
                correctAnswer: 24,
                hintText: "加一條紅色的虛線, 把圖形分割 成正方形及 平行四邊形",
                successMsg: "恭喜你！過了第一關！",
                SvgComponent: Level1SVG
            },
            {
                id: 2,
                unit: 'cm',
                correctAnswer: 35,
                hintText: "加一條紅色的虛線, 把圖形上下分割 成為一個三角形及長方形",
                successMsg: "恭喜你！過了第二關！",
                SvgComponent: Level2SVG
            },
            {
                id: 3,
                unit: 'm',
                correctAnswer: 40,
                hintText: "加一條紅色的虛線, 把圖形上下分割 成2個梯形",
                successMsg: "恭喜你！過了第三關！",
                SvgComponent: Level3SVG
            }
        ];

        // --- 遊戲主程式 ---
        function PolygonAreaGame() {
            const [currentLevelIndex, setCurrentLevelIndex] = React.useState(0);
            const [inputValue, setInputValue] = React.useState('');
            const [feedback, setFeedback] = React.useState(null); 
            const [showHint, setShowHint] = React.useState(false);
            const [gameStarted, setGameStarted] = React.useState(false);
            const [gameComplete, setGameComplete] = React.useState(false);

            // 控制背景音樂的播放與停止
            React.useEffect(() => {
                if (gameStarted && !gameComplete) {
                    startBGM();
                } else {
                    stopBGM();
                }
                return () => stopBGM();
            }, [gameStarted, gameComplete]);

            const level = levels[currentLevelIndex];

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!inputValue) return;

                const answer = parseInt(inputValue, 10);
                if (answer === level.correctAnswer) {
                    playSound('correct');
                    setFeedback('success');
                    if (currentLevelIndex === levels.length - 1) {
                        setGameComplete(true);
                    }
                } else {
                    playSound('incorrect');
                    setFeedback('error');
                }
            };

            const handleNextLevel = () => {
                if (currentLevelIndex < levels.length - 1) {
                    setCurrentLevelIndex(currentLevelIndex + 1);
                    setInputValue('');
                    setFeedback(null);
                    setShowHint(false);
                }
            };

            const handleKeypadPress = (key) => {
                if (isSuccess) return;
                setFeedback(null);
                if (key === 'C') {
                    setInputValue('');
                } else if (key === 'DEL') {
                    setInputValue(prev => prev.slice(0, -1));
                } else {
                    setInputValue(prev => prev + key);
                }
            };

            const resetGame = () => {
                setCurrentLevelIndex(0);
                setInputValue('');
                setFeedback(null);
                setShowHint(false);
                setGameStarted(false);
                setGameComplete(false);
            };

            if (!gameStarted) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-200 to-indigo-300 flex flex-col items-center justify-center p-4 font-sans">
                        <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-8 md:p-12 max-w-xl w-full text-center border-4 border-indigo-400">
                            <div className="flex justify-center mb-6">
                                <div className="w-24 h-24 bg-indigo-500 rounded-full flex items-center justify-center shadow-lg transform hover:rotate-12 transition-transform">
                                    <IconTrophy className="w-12 h-12 text-white" />
                                </div>
                            </div>
                            <h1 className="text-4xl md:text-5xl font-extrabold text-indigo-900 mb-6 tracking-wide leading-tight">
                                小五數學：<br/>多邊形面積過三關
                            </h1>
                            <p className="text-xl text-gray-700 mb-10 font-medium leading-relaxed">
                                挑戰你的大腦，拆解圖形算面積！<br/>準備好接受三關的挑戰了嗎？
                            </p>
                            <button 
                                onClick={() => setGameStarted(true)}
                                className="group relative inline-flex items-center justify-center px-10 py-5 text-2xl font-bold text-white transition-all duration-200 bg-emerald-500 border-4 border-emerald-600 rounded-full hover:bg-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-300 hover:scale-105 active:scale-95 shadow-xl"
                            >
                                開始遊戲
                                <IconPlay className="w-6 h-6 ml-3 group-hover:translate-x-2 transition-transform" />
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameComplete && feedback === 'success' && currentLevelIndex === levels.length - 1) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-yellow-200 to-orange-300 flex flex-col items-center justify-center p-4 font-sans">
                        <div className="bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl p-10 md:p-14 max-w-xl w-full text-center border-4 border-yellow-400">
                            <IconTrophy className="w-32 h-32 text-yellow-500 mx-auto mb-6 animate-bounce" />
                            <h1 className="text-4xl md:text-5xl font-extrabold text-orange-600 mb-6">
                                恭喜你！<br/>你已成功通關！
                            </h1>
                            <p className="text-2xl text-gray-700 mb-10 font-bold">
                                你是計算多邊形面積的超級專家！🎉
                            </p>
                            <button 
                                onClick={resetGame}
                                className="px-10 py-5 text-2xl font-bold text-white transition-all duration-200 bg-blue-500 border-4 border-blue-600 rounded-full hover:bg-blue-400 hover:scale-105 active:scale-95 shadow-lg"
                            >
                                再玩一次
                            </button>
                        </div>
                    </div>
                );
            }

            const isSuccess = feedback === 'success';
            const isError = feedback === 'error';
            const SvgComponent = level.SvgComponent;

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-6 md:py-10 p-4 font-sans selection:bg-indigo-200">
                    <header className="mb-6 w-full max-w-4xl flex justify-between items-end px-4">
                        <h1 className="text-3xl md:text-4xl font-extrabold text-slate-800">多邊形面積過三關</h1>
                        <div className="bg-indigo-100 text-indigo-800 px-5 py-2 rounded-full font-bold text-xl border-2 border-indigo-200 shadow-sm">
                            第 {level.id} 關 / 共 {levels.length} 關
                        </div>
                    </header>

                    <main className="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-4xl w-full border-4 border-slate-200 flex flex-col md:flex-row">
                        <div className="bg-slate-50 p-6 md:p-8 flex justify-center items-center border-b-4 md:border-b-0 md:border-r-4 border-slate-200 relative w-full md:w-3/5 min-h-[350px]">
                            <div className="w-full h-full max-w-lg relative flex items-center justify-center">
                                <SvgComponent showHint={showHint} />
                            </div>
                            
                            {showHint && (
                                <div className="absolute top-4 left-4 right-4 bg-red-50 border-4 border-red-300 text-red-800 px-5 py-3 rounded-2xl font-bold text-lg shadow-lg flex items-start animate-fade-in z-10">
                                    <IconLightbulb className="w-8 h-8 mr-3 mt-1 text-red-600 shrink-0 animate-pulse" />
                                    <span>{level.hintText}</span>
                                </div>
                            )}
                        </div>

                        <div className="p-6 md:p-8 w-full md:w-2/5 flex flex-col justify-center text-center bg-white">
                            <h2 className="text-2xl md:text-3xl font-bold text-slate-700 mb-8 leading-relaxed">
                                這個圖形的總面積<br/>是多少 ({level.unit}²)？
                            </h2>

                            <form onSubmit={handleSubmit} className="flex flex-col items-center gap-4 mb-8">
                                <div className="relative w-full max-w-[240px]">
                                    <input
                                        type="number"
                                        value={inputValue}
                                        onChange={(e) => {
                                            setInputValue(e.target.value);
                                            setFeedback(null);
                                        }}
                                        disabled={isSuccess}
                                        placeholder="輸入面積"
                                        className="w-full text-center text-3xl font-bold text-slate-800 border-4 border-slate-300 rounded-2xl py-4 pr-12 pl-4 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all disabled:opacity-50 disabled:bg-slate-100 shadow-inner"
                                    />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400 pointer-events-none">
                                        {level.unit}²
                                    </span>
                                </div>
                                
                                {/* 數字小鍵盤 */}
                                {!isSuccess && (
                                    <div className="grid grid-cols-3 gap-2 w-full max-w-[240px] mb-2">
                                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                                            <button
                                                key={num}
                                                type="button"
                                                onClick={() => handleKeypadPress(num.toString())}
                                                className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xl py-3 rounded-xl shadow-sm border-2 border-slate-200 active:scale-95 transition-transform"
                                            >
                                                {num}
                                            </button>
                                        ))}
                                        <button
                                            type="button"
                                            onClick={() => handleKeypadPress('C')}
                                            className="bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xl py-3 rounded-xl shadow-sm border-2 border-red-200 active:scale-95 transition-transform"
                                        >
                                            C
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => handleKeypadPress('0')}
                                            className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xl py-3 rounded-xl shadow-sm border-2 border-slate-200 active:scale-95 transition-transform"
                                        >
                                            0
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => handleKeypadPress('DEL')}
                                            className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xl py-3 rounded-xl shadow-sm border-2 border-slate-300 active:scale-95 transition-transform flex justify-center items-center"
                                        >
                                            <IconDelete className="w-6 h-6" />
                                        </button>
                                    </div>
                                )}
                                
                                {!isSuccess && (
                                    <button 
                                        type="submit"
                                        className="w-full max-w-[240px] px-8 py-4 text-2xl font-bold text-white transition-all duration-200 bg-emerald-500 border-4 border-emerald-600 rounded-2xl hover:bg-emerald-400 hover:scale-105 active:scale-95 shadow-md flex items-center justify-center"
                                    >
                                        提交答案
                                    </button>
                                )}
                            </form>

                            <div className="min-h-[120px] flex flex-col items-center justify-center space-y-4 w-full">
                                {isError && (
                                    <div className="flex flex-col items-center text-rose-700 bg-rose-50 px-6 py-4 rounded-2xl border-4 border-rose-200 font-bold text-xl animate-bounce shadow-sm w-full">
                                        <IconXCircle className="w-8 h-8 mb-2" />
                                        <span>答錯了！<br/>不要灰心，再仔細計算看看！</span>
                                    </div>
                                )}

                                {isSuccess && (
                                    <div className="flex flex-col items-center space-y-4 w-full">
                                        <div className="flex flex-col items-center justify-center text-emerald-800 bg-emerald-100 px-6 py-4 rounded-2xl border-4 border-emerald-300 font-bold text-2xl w-full shadow-inner">
                                            <IconCheckCircle className="w-10 h-10 mb-2 text-emerald-600" />
                                            {level.successMsg}
                                        </div>
                                        
                                        {currentLevelIndex < levels.length - 1 && (
                                            <button 
                                                onClick={handleNextLevel}
                                                className="flex items-center justify-center w-full px-8 py-4 text-2xl font-bold text-white transition-all duration-200 bg-indigo-500 border-4 border-indigo-600 rounded-2xl hover:bg-indigo-400 hover:scale-105 active:scale-95 shadow-lg"
                                            >
                                                挑戰下一關
                                                <IconArrowRight className="w-7 h-7 ml-3" />
                                            </button>
                                        )}
                                    </div>
                                )}

                                {!isSuccess && !showHint && (
                                    <button 
                                        type="button"
                                        onClick={() => setShowHint(true)}
                                        className="flex items-center justify-center text-amber-600 bg-amber-50 hover:bg-amber-100 border-2 border-amber-200 transition-colors font-bold py-3 px-6 rounded-xl text-lg shadow-sm hover:scale-105 active:scale-95 w-full max-w-[240px]"
                                    >
                                        <IconHelpCircle className="w-7 h-7 mr-2 shrink-0" />
                                        <span>想不到嗎？獲取提示</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // 渲染 React 應用程式到 root 元素
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PolygonAreaGame />);
    </script>
</body>
</html>
